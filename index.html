<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY WORKS LIBRARY</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#202b3a;--muted:#778395;--line:#e3e8ef;--accent:#456b9b;--accent2:#eaf0f7;--danger:#b94a48;--shadow:0 8px 28px rgba(31,45,61,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--ink);color:#fff;font-weight:600}button.secondary{background:#eef1f5;color:var(--ink);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--muted);padding:7px}button.danger{background:#fff0ef;color:var(--danger);border:1px solid #f1d1cf}button:disabled{opacity:.45;cursor:not-allowed}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:#202b3a;color:#fff;padding:25px 16px;display:flex;flex-direction:column;gap:24px}.brand{padding:0 10px}.brand strong{display:block;font-size:17px;letter-spacing:1.5px}.brand span{font-size:10px;letter-spacing:2px;color:#aab6c6}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#c7d0dc;text-align:left;font-weight:500}.nav button.active,.nav button:hover{background:#344458;color:#fff}.side-bottom{margin-top:auto;display:grid;gap:6px}.side-bottom button{background:transparent;color:#c7d0dc;text-align:left}
main{min-width:0;padding:28px 34px 50px}.topbar{display:flex;align-items:center;gap:14px;margin-bottom:26px}.search{flex:1;position:relative}.search input{width:100%;padding:13px 15px 13px 42px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}.search:before{content:"⌕";position:absolute;left:15px;top:7px;font-size:24px;color:#8793a2}.top-actions{display:flex;gap:8px}.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin:12px 0 22px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:700}.pagehead h1{margin:5px 0 0;font-size:27px;letter-spacing:-.5px}.sub{color:var(--muted);font-size:13px;margin-top:6px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:26px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:17px 18px}.stat label{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:6px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 13px}.section-title h2{font-size:16px;margin:0}.muted{color:var(--muted)}.project-grid,.work-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}.project-card,.work-card{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer;transition:.15s;min-width:0}.project-card:hover,.work-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#c6d2e0}.cover{height:130px;background:linear-gradient(135deg,#dce5ef,#eef2f6);display:flex;align-items:center;justify-content:center;color:#8190a2;font-size:36px;overflow:hidden}.cover img,.cover video{width:100%;height:100%;object-fit:cover}.project-info,.work-info{padding:13px}.project-actions{display:flex;gap:6px;padding:0 13px 13px}.project-actions button{font-size:11px;padding:7px 10px}.custom-fields{display:grid;gap:8px}.custom-row{display:grid;grid-template-columns:minmax(100px,1fr) minmax(130px,2fr) auto;gap:7px;align-items:center}.custom-row input{min-width:0;padding:9px;border:1px solid var(--line);border-radius:8px}.custom-row button{padding:8px 10px}.detail-tools{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.section-label{font-size:12px;font-weight:700;color:#596779;margin:17px 0 8px}.project-actions{position:relative;z-index:1}.project-info strong,.work-info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-meta,.work-meta{font-size:11px;color:var(--muted);margin-top:6px}.work-thumb{height:155px;background:#edf1f5;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#8290a1;font-size:38px}.work-thumb img,.work-thumb video{width:100%;height:100%;object-fit:cover}.file-icon{display:flex;flex-direction:column;align-items:center;gap:7px}.file-icon small{font-size:10px;letter-spacing:1px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0}.toolbar select,.toolbar input{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 12px;color:var(--ink)}.spacer{flex:1}.view-switch{display:flex;background:#e9edf2;border-radius:9px;padding:3px}.view-switch button{background:transparent;color:var(--muted);padding:7px 10px}.view-switch button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0001}.work-list{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.work-row{display:grid;grid-template-columns:54px minmax(140px,2fr) 90px minmax(110px,1fr) 110px 65px;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}.work-row:last-child{border:0}.work-row:hover{background:#f8fafc}.row-thumb{height:42px;width:54px;border-radius:6px;background:#edf1f5;display:flex;align-items:center;justify-content:center;overflow:hidden}.row-thumb img,.row-thumb video{width:100%;height:100%;object-fit:cover}.row-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-sub{font-size:11px;color:var(--muted);margin-top:3px}.type-pill{font-size:10px;background:#eef2f6;padding:5px 7px;border-radius:6px;text-align:center;color:#536174}.empty{padding:45px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #ccd5df;border-radius:13px}.empty strong{display:block;color:var(--ink);margin-bottom:7px}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#17233388;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{background:#fff;border-radius:16px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:23px;box-shadow:0 20px 60px #0003}.modal h2{margin:0 0 18px;font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#596779}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}.field textarea{min-height:85px;resize:vertical}.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:20px}.right-actions{display:flex;gap:8px}.dropzone{border:1.5px dashed #aebccc;border-radius:12px;padding:25px;text-align:center;background:#f8fafc;color:#667588}.dropzone.drag{background:#eaf1f8;border-color:var(--accent)}.detail-preview{background:#f0f3f6;border-radius:12px;min-height:180px;max-height:360px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:18px}.detail-preview img,.detail-preview video,.detail-preview iframe{max-width:100%;max-height:360px;border:0}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.attachment-list{display:grid;gap:7px;margin-top:9px}.photo-dropzone{border:1.5px dashed #aebccc;border-radius:12px;padding:18px 14px;text-align:center;background:#f8fafc;color:#667588;cursor:pointer;transition:.15s;margin-top:9px}.photo-dropzone:hover,.photo-dropzone.drag{background:#eaf1f8;border-color:var(--accent);color:var(--ink)}.photo-dropzone strong{display:block;font-size:13px;color:#42536a}.photo-dropzone span{display:block;font-size:11px;margin-top:5px}.attachment-row{display:flex;align-items:center;gap:9px;padding:9px 10px;background:#f7f9fb;border:1px solid var(--line);border-radius:9px;min-width:0}.attachment-row .attachment-name{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px}.attachment-row .attachment-meta{font-size:10px;color:var(--muted);margin-top:2px}.attachment-row button{padding:6px 9px;font-size:11px;white-space:nowrap}.attachment-preview-box{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#f7f9fb}.attachment-preview-box h3{font-size:13px;margin:0 0 10px;overflow-wrap:anywhere}.attachment-preview-stage{min-height:100px;max-height:520px;display:flex;align-items:center;justify-content:center;overflow:auto;background:#edf1f5;border-radius:8px;padding:8px}.attachment-preview-stage img{max-width:100%;max-height:490px;object-fit:contain}.attachment-preview-stage video,.attachment-preview-stage iframe{width:100%;max-height:490px;min-height:320px;border:0;background:#fff}.attachment-preview-stage audio{width:min(100%,520px)}.attachment-preview-stage pre{width:100%;max-height:460px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;font:12px/1.6 ui-monospace,monospace;background:#fff;padding:12px;border-radius:6px}.attachment-preview-note{font-size:12px;color:var(--muted);line-height:1.7;text-align:center;padding:24px}.attachment-empty{padding:13px;border:1px dashed #ccd5df;border-radius:9px;color:var(--muted);font-size:12px;text-align:center}.detail-item label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.detail-item div{font-size:13px;overflow-wrap:anywhere}.toast{position:fixed;bottom:22px;right:22px;background:#202b3a;color:#fff;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:30;font-size:13px}.mobile-menu{display:none}
@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{padding:12px 14px;display:flex;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}.brand{flex:1}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px}.side-bottom{display:flex;flex-direction:row;flex-wrap:wrap;width:100%;margin-top:0;gap:4px}.side-bottom button{font-size:11px;padding:7px 9px}main{padding:20px 16px}.stats{grid-template-columns:repeat(2,1fr)}.work-row{grid-template-columns:45px minmax(100px,1fr) 70px 55px}.work-row .hide-mobile{display:none}.row-thumb{width:45px}.pagehead{align-items:flex-start}.topbar{flex-wrap:wrap}.search{min-width:100%}}
@media(max-width:520px){.sidebar{display:block}.brand{padding:5px 7px 10px}.nav{gap:2px}.nav button{font-size:12px;padding:8px}.top-actions button{font-size:12px;padding:9px}.pagehead h1{font-size:23px}.project-grid,.work-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cover{height:95px}.work-thumb{height:110px}.project-info,.work-info{padding:10px}.form-grid,.detail-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.work-row{grid-template-columns:40px minmax(90px,1fr) 55px}.work-row .hide-mobile{display:none}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><strong>MY WORKS LIBRARY</strong><span>CREATIVE ARCHIVE</span></div>
  <nav class="nav">
    <button class="active" data-page="dashboard">⌂　ダッシュボード</button>
    <button data-page="projects">▣　プロジェクト</button>
    <button data-page="works">▦　すべての作品</button>
    <button data-page="favorites">☆　お気に入り</button>
  </nav>
  <div class="side-bottom">
    <button id="backupBtn">⇧　バックアップを書き出す</button>
    <button id="restoreBtn">⇩　バックアップを復元</button>
    <button id="settingsBtn">⚙　設定・データ管理</button>
  </div>
</aside>
<main>
  <div class="topbar">
    <div class="search"><input id="globalSearch" placeholder="作品名・プロジェクト名・タグ・メモを検索"></div>
    <div class="top-actions"><button class="secondary" id="newProjectBtn">＋ プロジェクト</button><button id="addWorkBtn">＋ 作品を登録</button></div>
  </div>
  <section id="dashboardPage">
    <div class="pagehead"><div><div class="eyebrow">OVERVIEW</div><h1>ダッシュボード</h1><div class="sub">制作した作品を、ひとつの場所に。</div></div></div>
    <div class="stats">
      <div class="stat"><label>プロジェクト</label><strong id="statProjects">0</strong></div>
      <div class="stat"><label>登録作品</label><strong id="statWorks">0</strong></div>
      <div class="stat"><label>画像・動画</label><strong id="statMedia">0</strong></div>
      <div class="stat"><label>お気に入り</label><strong id="statFavorites">0</strong></div>
    </div>
    <div class="section-title"><h2>プロジェクト</h2><button class="ghost" data-goto="projects">すべて見る →</button></div>
    <div id="dashboardProjects" class="project-grid"></div>
    <div class="section-title"><h2>最近追加した作品</h2><button class="ghost" data-goto="works">すべて見る →</button></div>
    <div id="recentWorks" class="work-grid"></div>
  </section>
  <section id="projectsPage" class="hidden">
    <div class="pagehead"><div><div class="eyebrow">YOUR COLLECTIONS</div><h1>プロジェクト</h1><div class="sub">案件・テーマごとに作品をまとめて管理します。</div></div><button id="newProjectBtn2">＋ 新規作成</button></div>
    <div id="projectGrid" class="project-grid"></div>
  </section>
  <section id="worksPage" class="hidden">
    <div class="pagehead"><div><div class="eyebrow">ALL CREATIONS</div><h1 id="worksHeading">すべての作品</h1><div class="sub" id="worksSub">登録した作品をまとめて表示します。</div></div></div>
    <div class="toolbar">
      <select id="projectFilter"><option value="">すべてのプロジェクト</option></select>
      <select id="typeFilter"><option value="">すべての形式</option><option>画像</option><option>動画</option><option>PDF</option><option>Excel</option><option>文書</option><option>その他</option></select>
      <select id="sortFilter"><option value="newest">登録日が新しい順</option><option value="oldest">登録日が古い順</option><option value="name">名前順</option><option value="size">ファイルサイズ順</option></select>
      <div class="spacer"></div>
      <div class="view-switch"><button id="gridView" class="active" title="ギャラリー">▦</button><button id="listView" title="リスト">☷</button></div>
    </div>
    <div id="worksContainer"></div>
  </section>
</main>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<input id="filePicker" type="file" multiple hidden>
<input id="restorePicker" type="file" accept=".json,application/json" hidden>
<input id="workImportPicker" type="file" accept=".json,application/json" hidden>
<input id="workReplacePicker" type="file" hidden>
<input id="attachmentPicker" type="file" multiple hidden>
<script>
(()=> {
'use strict';
const DB_NAME='MyWorksLibraryDB', DB_VERSION=1;
let db, projects=[], works=[], currentPage='dashboard', currentProjectId=null, favoritesOnly=false, listMode='grid', query='';
const $=id=>document.getElementById(id);
const uid=()=> 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=v=>v?new Date(v).toLocaleDateString('ja-JP'):'—';
const fmtSize=n=>{if(!n)return '0 B';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]};
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});if(!d.objectStoreNames.contains('works'))d.createObjectStore('works',{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function all(store){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function put(store,obj){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(store,id){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function refresh(){[projects,works]=await Promise.all([all('projects'),all('works')]);projects.sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt));works.sort((a,b)=>b.createdAt-a.createdAt);render()}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function typeOf(file){const t=file.type||'',n=file.name.toLowerCase();if(t.startsWith('image/')||/\.(jpg|jpeg|png|gif|webp|svg|bmp|heic)$/.test(n))return'画像';if(t.startsWith('video/')||/\.(mp4|mov|webm|m4v|avi|mkv)$/.test(n))return'動画';if(t==='application/pdf'||n.endsWith('.pdf'))return'PDF';if(/\.(xls|xlsx|csv|ods)$/.test(n))return'Excel';if(/\.(doc|docx|txt|rtf|ppt|pptx)$/.test(n))return'文書';return'その他'}
function iconFor(type){return ({画像:'▧',動画:'▶',PDF:'PDF',Excel:'XLS',文書:'DOC',その他:'FILE'})[type]||'FILE'}
function projectName(id){return projects.find(p=>p.id===id)?.name||'未設定'}
function thumb(w,small=false){const cls=small?'row-thumb':'work-thumb';if(w.type==='画像'&&w.blob)return `<div class="${cls}"><img src="${URL.createObjectURL(w.blob)}" alt=""></div>`;if(w.type==='動画'&&w.blob)return `<div class="${cls}"><video src="${URL.createObjectURL(w.blob)}" muted></video></div>`;return `<div class="${cls}"><div class="file-icon">${iconFor(w.type)}<small>${esc((w.ext||w.type).toUpperCase())}</small></div></div>`}
function workCard(w){return `<article class="work-card" data-work="${w.id}">${thumb(w)}<div class="work-info"><strong title="${esc(w.name)}">${esc(w.name)}</strong><div class="work-meta">${esc(projectName(w.projectId))} · ${esc(w.type)} · ${fmtDate(w.createdAt)}</div></div></article>`}
function projectCard(p){const count=works.filter(w=>w.projectId===p.id).length;const cover=works.find(w=>w.id===p.coverWorkId)||works.find(w=>w.projectId===p.id&&w.type==='画像');let visual=cover&&cover.type==='画像'?`<img src="${URL.createObjectURL(cover.blob)}">`:`<span>▣</span>`;return `<article class="project-card" data-project="${p.id}"><div class="cover">${visual}</div><div class="project-info"><strong>${esc(p.name)}</strong><div class="project-meta">${esc(p.category||'未分類')} · ${p.year||'年度未設定'} · ${count} files</div><div class="project-meta">${fmtDate(p.updatedAt||p.createdAt)}</div></div><div class="project-actions"><button class="secondary" data-project-edit="${p.id}">編集</button><button class="danger" data-project-delete="${p.id}">削除</button></div></article>`}
function empty(msg,sub){return `<div class="empty"><strong>${esc(msg)}</strong>${esc(sub||'')}</div>`}
function renderDashboard(){ $('statProjects').textContent=projects.length;$('statWorks').textContent=works.length;$('statMedia').textContent=works.filter(w=>['画像','動画'].includes(w.type)).length;$('statFavorites').textContent=works.filter(w=>w.favorite).length;$('dashboardProjects').innerHTML=projects.slice(0,4).map(projectCard).join('')||empty('まだプロジェクトがありません','「＋ プロジェクト」から作成できます。');$('recentWorks').innerHTML=works.slice(0,6).map(workCard).join('')||empty('まだ作品が登録されていません','「＋ 作品を登録」からファイルを追加してください。')}
function renderProjects(){$('projectGrid').innerHTML=projects.map(projectCard).join('')||empty('プロジェクトがありません','まずはプロジェクトを作成してください。')}
function filteredWorks(){let arr=works.filter(w=>!favoritesOnly||w.favorite);if(currentProjectId)arr=arr.filter(w=>w.projectId===currentProjectId);const pf=$('projectFilter')?.value,tf=$('typeFilter')?.value,sort=$('sortFilter')?.value;if(pf)arr=arr.filter(w=>w.projectId===pf);if(tf)arr=arr.filter(w=>w.type===tf);if(query){const q=query.toLowerCase();arr=arr.filter(w=>[w.name,w.originalName,w.notes,w.tags,projectName(w.projectId),w.type].join(' ').toLowerCase().includes(q))}if(sort==='oldest')arr.sort((a,b)=>a.createdAt-b.createdAt);else if(sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'ja'));else if(sort==='size')arr.sort((a,b)=>b.size-a.size);else arr.sort((a,b)=>b.createdAt-a.createdAt);return arr}
function renderWorks(){const arr=filteredWorks();$('worksHeading').textContent=favoritesOnly?'お気に入り':currentProjectId?projectName(currentProjectId):'すべての作品';$('worksSub').textContent=`${arr.length} 件の作品`;if(!arr.length){$('worksContainer').innerHTML=empty('該当する作品がありません','検索条件を変更するか、新しい作品を登録してください。');return}if(listMode==='grid')$('worksContainer').innerHTML=`<div class="work-grid">${arr.map(workCard).join('')}</div>`;else $('worksContainer').innerHTML=`<div class="work-list">${arr.map(w=>`<div class="work-row" data-work="${w.id}">${thumb(w,true)}<div><div class="row-name">${esc(w.name)}</div><div class="row-sub">${esc(w.tags||'')}</div></div><div class="type-pill">${esc(w.type)}</div><div class="hide-mobile muted" style="font-size:12px">${esc(projectName(w.projectId))}</div><div class="hide-mobile muted" style="font-size:12px">${fmtDate(w.createdAt)}</div><div class="hide-mobile muted" style="font-size:11px;text-align:right">${fmtSize(w.size)}</div></div>`).join('')}</div>`}
function render(){renderDashboard();renderProjects();const pf=$('projectFilter');if(pf){const old=pf.value;pf.innerHTML='<option value="">すべてのプロジェクト</option>'+projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');pf.value=old}renderWorks()}
function showPage(page){currentPage=page;favoritesOnly=page==='favorites';currentProjectId=null;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));['dashboard','projects','works'].forEach(p=>$(p+'Page').classList.toggle('hidden',page!==p&&page!=='favorites'));if(page==='favorites'){$('worksPage').classList.remove('hidden');$('dashboardPage').classList.add('hidden');$('projectsPage').classList.add('hidden')}if(page==='works')$('worksPage').classList.remove('hidden');renderWorks()}

async function saveAttachmentsForWork(wid,selected){const target=works.find(x=>x.id===wid);if(!target||!selected.length)return;const current=Array.isArray(target.attachments)?target.attachments:[];const added=selected.map(f=>({id:uid(),name:f.name,type:typeOf(f),ext:f.name.includes('.')?f.name.split('.').pop().toLowerCase():'',mime:f.type,size:f.size,blob:f,addedAt:Date.now()}));target.attachments=[...current,...added];target.updatedAt=Date.now();try{await put('works',target);await refresh();workDetail(target.id);toast(`${added.length} 件のファイルを追加しました`)}catch(err){console.error(err);toast('ファイルの保存に失敗しました')}}
function workDetail(id){const w=works.find(x=>x.id===id);if(!w)return;w.customFields=Array.isArray(w.customFields)?w.customFields:[];let attachments=Array.isArray(w.attachments)?[...w.attachments]:[];let attachmentPreviewUrl=null;const attachmentRows=()=>attachments.length?attachments.map(a=>`<div class="attachment-row"><div class="attachment-name">📎 ${esc(a.name)}<div class="attachment-meta">${esc(a.type||'その他')} · ${fmtSize(a.size||0)}</div></div><button class="secondary" type="button" data-attachment-preview="${a.id}">プレビュー</button><button class="secondary" type="button" data-attachment-download="${a.id}">保存</button><button class="danger" type="button" data-attachment-remove="${a.id}">削除</button></div>`).join(''):'<div class="attachment-empty">添付ファイルはまだありません。</div>';const customRows=()=>w.customFields.map((f,i)=>`<div class="custom-row" data-custom-row="${i}"><input data-custom-label="${i}" placeholder="項目名（例：サイズ）" value="${esc(f.label||'')}"><input data-custom-value="${i}" placeholder="内容を入力" value="${esc(f.value||'')}"><button class="danger" type="button" data-custom-remove="${i}" title="項目を削除">×</button></div>`).join('');modal(`<h2>作品詳細</h2><div class="detail-preview">${preview(w)}</div><div class="form-grid"><div class="field"><label>作品名</label><input id="dName" value="${esc(w.name)}"></div><div class="field"><label>プロジェクト</label><select id="dProject"><option value="">未設定</option>${projects.map(p=>`<option value="${p.id}" ${w.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>タグ</label><input id="dTags" value="${esc(w.tags||'')}"></div><div class="field"><label>使用ソフト</label><input id="dSoftware" value="${esc(w.software||'')}" placeholder="例：Photoshop、Illustrator"></div><div class="field"><label>制作日</label><input id="dCreatedWork" type="date" value="${w.workDate||''}"></div><div class="field"><label>納品日</label><input id="dDeliveryDate" type="date" value="${w.deliveryDate||''}"></div><div class="field"><label>クライアント・依頼者</label><input id="dClient" value="${esc(w.client||'')}"></div><div class="field"><label>制作担当者</label><input id="dAuthor" value="${esc(w.author||'')}"></div><div class="field"><label>制作目的・媒体</label><input id="dPurpose" value="${esc(w.purpose||'')}" placeholder="例：SNS広告、チラシ"></div><div class="field"><label>サイズ・仕様</label><input id="dSpec" value="${esc(w.spec||'')}" placeholder="例：A4、1920×1080"></div><div class="field full"><label>参考URL</label><input id="dReferenceUrl" type="url" value="${esc(w.referenceUrl||'')}" placeholder="https://"></div><div class="field full"><label>公開URL</label><input id="dPublicUrl" type="url" value="${esc(w.publicUrl||'')}" placeholder="https://"></div><div class="field full"><label>メモ</label><textarea id="dNotes">${esc(w.notes||'')}</textarea></div></div><div class="section-label">添付ファイル</div><div id="attachmentList" class="attachment-list">${attachmentRows()}</div><div id="attachmentPreviewBox"></div><div class="photo-dropzone" id="photoDropzone" role="button" tabindex="0"><strong>写真・各種ファイルをここにドラッグ＆ドロップ</strong><span>またはクリックしてファイルを選択（画像・PDF・動画・音声・Office書類・ZIPなど）</span></div><div class="detail-tools"><button class="secondary" id="addAttachments" type="button">＋ ファイルを追加</button></div><div class="section-label">自由に追加できる項目</div><div id="customFields" class="custom-fields">${customRows()||'<div class="muted" style="font-size:12px">追加項目はまだありません。</div>'}</div><div class="detail-tools"><button class="secondary" id="addCustomField" type="button">＋ 項目を追加</button><button class="secondary" id="exportWorkData" type="button">この作品のデータを書き出す</button><button class="secondary" id="importWorkData" type="button">データを読み込む</button><button class="secondary" id="replaceWorkFile" type="button">ファイルを差し替える</button></div><div class="field full"><label>ファイル情報</label><div class="muted" style="font-size:12px">${esc(w.originalName)}　·　${esc(w.type)}　·　${fmtSize(w.size)}　·　登録 ${fmtDate(w.createdAt)}</div></div><div class="modal-actions"><div class="right-acti $('attachmentList').onclick=e=>{const prev=e.target.closest('[data-attachment-preview]'),down=e.target.closest('[data-attachment-download]'),remove=e.target.closest('[data-attachment-remove]');if(prev){const a=attachments.find(x=>x.id===prev.dataset.attachmentPreview);if(a)showAttachmentPreview(a);return}if(down){const a=attachments.find(x=>x.id===down.dataset.attachmentDownload);if(a)downloadBlob(a.blob,a.name)}if(remove){const removedId=remove.dataset.attachmentRemove;attachments=attachments.filter(x=>x.id!==removedId);$('attachmentList').innerHTML=attachmentRows();$('attachmentPreviewBox').innerHTML=''}};
function showAttachmentPreview(a){const box=$('attachmentPreviewBox');if(!box)return;if(attachmentPreviewUrl){URL.revokeObjectURL(attachmentPreviewUrl);attachmentPreviewUrl=null}const mime=a.mime||a.blob?.type||'',name=(a.name||'').toLowerCase();let body='';if(mime.startsWith('image/')||/\.(png|jpe?g|gif|webp|bmp|svg)$/.test(name)){const url=attachmentPreviewUrl=URL.createObjectURL(a.blob);body=`<img src="${url}" alt="${esc(a.name)}">`}else if(mime.startsWith('video/')||/\.(mp4|webm|mov|m4v|ogv)$/.test(name)){const url=attachmentPreviewUrl=URL.createObjectURL(a.blob);body=`<video src="${url}" controls playsinline></video>`}else if(mime.startsWith('audio/')||/\.(mp3|wav|ogg|m4a|aac|flac)$/.test(name)){const url=attachmentPreviewUrl=URL.createObjectURL(a.blob);body=`<audio src="${url}" controls></audio>`}else if(mime==='application/pdf'||name.endsWith('.pdf')){const url=attachmentPreviewUrl=URL.createObjectURL(a.blob);body=`<iframe src="${url}" title="${esc(a.name)}"></iframe>`}else if(mime.startsWith('text/')||/\.(txt|md|csv|json|xml|html|css|js|log)$/.test(name)){box.innerHTML=`<div class="attachment-preview-box"><h3>${esc(a.name)}</h3><div class="attachment-preview-stage"><pre>読み込み中...</pre></div><div class="detail-tools"><button class="secondary" type="button" id="closeAttachmentPreview">プレビューを閉じる</button></div></div>`;a.blob.text().then(t=>{const pre=box.querySelector('pre');if(pre)pre.textContent=t.slice(0,200000)}).catch(()=>{});$('closeAttachmentPreview').onclick=()=>box.innerHTML='';return}else{body=`<div class="attachment-preview-note">このファイル形式はブラウザ内で直接プレビューできません。<br>「保存」からダウンロードして対応アプリで開いてください。<br><small>${esc(a.type||'ファイル')} · ${esc(a.name)}</small></div>`}box.innerHTML=`<div class="attachment-preview-box"><h3>${esc(a.name)}</h3><div class="attachment-preview-stage">${body}</div><div class="detail-tools"><button class="secondary" type="button" id="closeAttachmentPreview">プレビューを閉じる</button></div></div>`;$('closeAttachmentPreview').onclick=()=>{const media=box.querySelector('video,audio');if(media)media.pause();if(attachmentPreviewUrl){URL.revokeObjectURL(attachmentPreviewUrl);attachmentPreviewUrl=null}box.innerHTML=''}};

function safeFileName(s){return String(s||'work').replace(/[\\/:*?"<>|]/g,'_').slice(0,80)}
async function blobToBase64(blob){const buf=await blob.arrayBuffer();let binary='';const bytes=new Uint8Array(buf);for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary)}
function base64ToBlob(data,mime){const binary=atob(data||''),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type:mime||'application/octet-stream'})}
async function workToJSON(w){const {blob,...meta}=w;const attachments=[];for(const a of (w.attachments||[])){const {blob:ab,...am}=a;attachments.push({...am,blobData:await blobToBase64(ab)})}return {app:'MY WORKS LIBRARY WORK',version:2,exportedAt:new Date().toISOString(),work:{...meta,blobData:await blobToBase64(blob),attachmentsData:attachments}}}
async function importSingleWork(file){try{const data=JSON.parse(await file.text());if(data.app!=='MY WORKS LIBRARY WORK'||!data.work||!data.work.blobData)throw Error('形式が違います');const old=works.find(x=>x.id===$('workImportPicker').dataset.workId);if(!old)return;if(!confirm('読み込んだデータで現在の作品情報とファイル・添付ファイルを置き換えますか？'))return;const {blobData,attachmentsData,...meta}=data.work;const blob=base64ToBlob(blobData,meta.mime);const attachments=[];for(const a of (attachmentsData||[])){const {blobData:ab,...am}=a;attachments.push({...am,blob:base64ToBlob(ab,am.mime)})}await put('works',{...old,...meta,id:old.id,blob,attachments,updatedAt:Date.now()});await refresh();closeModal();toast('作品データを読み込みました')}catch(e){console.error(e);alert('作品データを読み込めませんでした。JSONファイルを確認してください。')}}
async function replaceSingleWorkFile(file){const w=works.find(x=>x.id===$('workReplacePicker').dataset.workId);if(!w||!file)return;if(!confirm(`「${file.name}」にファイルを差し替えますか？作品情報は引き継がれます。`))return;const ext=file.name.includes('.')?file.name.split('.').pop().toLowerCase():'';w.blob=file;w.originalName=file.name;w.ext=ext;w.type=typeOf(file);w.mime=file.type;w.size=file.size;w.updatedAt=Date.now();await put('works',w);await refresh();closeModal();toast('作品ファイルを差し替えました')}

function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function backup(){const data={app:'MY WORKS LIBRARY',version:2,exportedAt:new Date().toISOString(),projects,works:[]};for(const w of works){const {blob,...meta}=w;const attachments=[];for(const a of (w.attachments||[])){const {blob:ab,...am}=a;attachments.push({...am,blobData:await blobToBase64(ab)})}data.works.push({...meta,blobData:await blobToBase64(blob),attachmentsData:attachments})}const blob=new Blob([JSON.stringify(data)],{type:'application/json'});downloadBlob(blob,'my-works-library-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('バックアップを書き出しました')}
async function restore(file){try{const data=JSON.parse(await file.text());if(data.app!=='MY WORKS LIBRARY'||!Array.isArray(data.projects)||!Array.isArray(data.works))throw Error('形式が違います');if(!confirm(`${data.projects.length} プロジェクト、${data.works.length} 作品を復元します。既存データと同じIDは上書きされます。続けますか？`))return;for(const p of data.projects)await put('projects',p);for(const w of data.works){const blob=base64ToBlob(w.blobData,w.mime);const attachments=[];for(const a of (w.attachmentsData||[])){const {blobData:ab,...am}=a;attachments.push({...am,blob:base64ToBlob(ab,am.mime)})}const {blobData,attachmentsData,...meta}=w;await put('works',{...meta,blob,attachments})}await refresh();toast('バックアップを復元しました')}catch(e){console.error(e);alert('バックアップを読み込めませんでした。ファイル形式や内容を確認してください。')}}
function settings(){modal(`<h2>設定・データ管理</h2><div class="panel" style="padding:15px;margin-bottom:12px;box-shadow:none"><strong>保存先について</strong><p class="muted" style="font-size:13px;line-height:1.7">作品ファイルと管理情報は、このブラウザのIndexedDBに保存されます。同じ端末・同じブラウザで利用してください。ブラウザデータの削除や端末故障に備え、定期的にバックアップを保存してください。</p></div><div class="detail-grid"><div class="detail-item"><label>プロジェクト数</label><div>${projects.length}</div></div><div class="detail-item"><label>作品数</label><div>${works.length}</div></div><div class="detail-item"><label>登録ファイル合計</label><div>${fmtSize(works.reduce((a,w)=>a+(w.size||0),0))}</div></div><div class="detail-item"><label>データベース</label><div>IndexedDB / v1</div></div></div><div class="modal-actions"><button class="danger" id="clearAll">全データを削除</button><div class="right-actions"><button class="secondary" id="settingsBackup">バックアップを書き出す</button><button class="secondary" id="settingsRestore">バックアップを復元</button><button id="settingsClose">閉じる</button></div></div>`);$('settingsClose').onclick=closeModal;$('settingsBackup').onclick=()=>{closeModal();backup()};$('settingsRestore').onclick=()=>{closeModal();$('restorePicker').click()};$('clearAll').onclick=async()=>{if(confirm('すべてのプロジェクト・作品・ファイルを完全に削除します。この操作は取り消せません。')){await new Promise(r=>{const tx=db.transaction(['projects','works'],'readwrite');tx.objectStore('projects').clear();tx.objectStore('works').clear();tx.oncomplete=r});closeModal();await refresh();toast('すべてのデータを削除しました')}}}

$('addWorkBtn').onclick=addFiles;
$('backupBtn').onclick=backup;$('restoreBtn').onclick=()=>$('restorePicker').click();$('restorePicker').onchange=e=>{if(e.target.files[0])restore(e.target.files[0]);e.target.value=''};
$('workImportPicker').onchange=e=>{if(e.target.files[0])importSingleWork(e.target.files[0]);e.target.value=''};
$('workReplacePicker').onchange=e=>{if(e.target.files[0])replaceSingleWorkFile(e.target.files[0]);e.target.value=''};
$('attachmentPicker').onchange=e=>{const selected=[...e.target.files],wid=e.target.dataset.workId;if(selected.length)saveAttachmentsForWork(wid,selected);e.target.value='';$('attachmentPicker').accept='*/*'};
$('settingsBtn').onclick=settings;
$('globalSearch').oninput=e=>{query=e.target.value;if(currentPage==='dashboard'){showPage('works')}renderWorks()};
['projectFilter','typeFilter','sortFilter'].forEach(id=>$(id).onchange=renderWorks);
$('gridView').onclick=()=>{listMode='grid';$('gridView').classList.add('active');$('listView').classList.remove('active');renderWorks()};
$('listView').onclick=()=>{listMode='list';$('listView').classList.add('active');$('gridView').classList.remove('active');renderWorks()};
document.addEventListener('click',e=>{const edit=e.target.closest('[data-project-edit]'),remove=e.target.closest('[data-project-delete]');if(edit){e.stopPropagation();projectForm(projects.find(x=>x.id===edit.dataset.projectEdit));return}if(remove){e.stopPropagation();const p=projects.find(x=>x.id===remove.dataset.projectDelete);if(p)deleteProject(p.id);return}const p=e.target.closest('[data-project]'),w=e.target.closest('[data-work]');if(p)showProject(p.dataset.project);else if(w)workDetail(w.dataset.work)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
(async()=>{try{db=await openDB();await refresh()}catch(e){console.error(e);alert('このブラウザではIndexedDBを利用できません。最新のChrome、Edge、Safariなどでお試しください。')}})();
})();
